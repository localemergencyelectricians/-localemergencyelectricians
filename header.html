<!-- ===== REUSABLE HEADER (styles + markup + behavior). Edit PHONE below once; used on every page. ===== -->
<style>
.pe-header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid transparent;transition:box-shadow .25s,border-color .25s}
.pe-header.scrolled{box-shadow:0 6px 24px rgba(16,42,67,.12);border-color:#e3e9f0}
.pe-bar{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.pe-logo img{height:46px;width:auto;object-fit:contain;display:block}
.pe-logo{font:800 20px Montserrat,sans-serif;color:#102A43;text-decoration:none}
.pe-nav{margin-left:auto;display:flex;gap:4px;align-items:center}
.pe-nav a,.pe-nav button{font:600 15px Inter,sans-serif;color:#102A43;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;text-decoration:none}
.pe-nav a:hover,.pe-nav button:hover{background:#F3F6FA;color:#0879E8}
.pe-dd{position:relative}
.pe-dd-menu{position:absolute;top:100%;left:0;min-width:260px;background:#fff;border:1px solid #e3e9f0;border-radius:12px;box-shadow:0 16px 40px rgba(16,42,67,.16);padding:8px;opacity:0;visibility:hidden;transform:translateY(6px);transition:.2s}
.pe-dd:hover .pe-dd-menu,.pe-dd:focus-within .pe-dd-menu,.pe-dd.open .pe-dd-menu{opacity:1;visibility:visible;transform:none}
.pe-dd-menu a{display:block;font-weight:500}
.pe-call{display:inline-flex;align-items:center;gap:8px;background:#FFB000;color:#102A43;font:700 15px Montserrat,sans-serif;padding:12px 18px;border-radius:10px;text-decoration:none;white-space:nowrap;transition:transform .2s,box-shadow .2s}
.pe-call:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,176,0,.4)}
.pe-burger{display:none;margin-left:auto;width:44px;height:44px;background:none;border:0;cursor:pointer}
.pe-burger span{display:block;width:24px;height:2px;background:#102A43;margin:5px auto;transition:.25s}
.pe-burger[aria-expanded=true] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.pe-burger[aria-expanded=true] span:nth-child(2){opacity:0}
.pe-burger[aria-expanded=true] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.pe-header a:focus-visible,.pe-header button:focus-visible{outline:3px solid #0879E8;outline-offset:2px}
@media(max-width:980px){
.pe-burger{display:block}.pe-call{margin-left:auto;padding:10px 14px}.pe-call .t{display:none}
.pe-nav{position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;padding:8px 20px 20px;max-height:0;overflow:hidden;visibility:hidden;transition:max-height .3s,visibility .3s;box-shadow:0 20px 30px rgba(16,42,67,.12)}
.pe-nav.open{max-height:85vh;overflow:auto;visibility:visible}
.pe-dd-menu{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;border:0;display:none;padding:0 0 0 12px}
.pe-dd.open .pe-dd-menu{display:block}
.pe-burger{margin-left:0}}
</style>
<header class="pe-header" id="peHeader">
 <div class="pe-bar">
  <a class="pe-logo" href="/" aria-label="Pro Electrician home"><img src="/images/local-emergency-electricians-logo.webp" alt="Pro Electrician" width="180" height="46" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'Pro Electrician'}))"></a>
  <a class="pe-call" data-phone href="tel:+10000000000" aria-label="Call an electrician now"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><span class="t">Call Now</span></a>
  <button class="pe-burger" id="peBurger" aria-label="Open menu" aria-expanded="false" aria-controls="peNav"><span></span><span></span><span></span></button>
  <nav class="pe-nav" id="peNav" aria-label="Main">
   <a href="/">Home</a>
   <div class="pe-dd"><button aria-haspopup="true" aria-expanded="false">Electrical Services ▾</button>
    <div class="pe-dd-menu"><a href="/services/">All Electrical Services</a><a href="/services/electrical-repairs">Electrical Repairs</a><a href="/services/electrical-panel-upgrades">Panel Upgrades</a><a href="/services/electrical-wiring">Wiring</a><a href="/services/switches-outlets">Switches &amp; Outlets</a><a href="/services/surge-protection">Surge Protection</a><a href="/services/generator-services">Generator Services</a><a href="/services/commercial-electrical">Commercial Electrical</a></div></div>
   <a href="/services/electrical-repairs">Emergency Services</a>
   <div class="pe-dd"><button aria-haspopup="true" aria-expanded="false">Service Areas ▾</button>
    <div class="pe-dd-menu" id="peAreasMenu"><a href="/locations/">All Locations</a></div></div>
   <a href="/about">About Us</a>
   <a href="/contact">Contact</a>
  </nav>
 </div>
</header>
<script>
(function(){
 var h=document.getElementById('peHeader'),b=document.getElementById('peBurger'),n=document.getElementById('peNav');
 addEventListener('scroll',function(){h.classList.toggle('scrolled',scrollY>8)},{passive:true});
 b.addEventListener('click',function(){var o=n.classList.toggle('open');b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Close menu':'Open menu')});
 h.querySelectorAll('.pe-dd > button').forEach(function(btn){btn.addEventListener('click',function(){var d=btn.parentNode,o=d.classList.toggle('open');btn.setAttribute('aria-expanded',o)})});
 addEventListener('keydown',function(e){if(e.key==='Escape'){n.classList.remove('open');b.setAttribute('aria-expanded','false');h.querySelectorAll('.pe-dd').forEach(function(d){d.classList.remove('open')})}});
 /* PHONE: set once in /site-config.js (window.PE_PHONE = {display:'(555) 000-0000', tel:'+15550000000'}) */
 var P=window.PE_PHONE;if(P)document.querySelectorAll('[data-phone]').forEach(function(a){a.href='tel:'+P.tel;var t=a.querySelector('.t');if(t)t.textContent=P.display});
})();
</script>
